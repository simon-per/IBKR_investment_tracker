server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 256;
    gzip_vary on;

    # Security headers.
    #
    # The CSP is tight because the bundle is entirely self-hosted: no CDN, no external
    # fonts, no analytics. 'unsafe-inline' on style-src is unavoidable — Recharts sets
    # inline styles on the SVG elements it renders — but script-src stays strict, which
    # is where it matters. connect-src is 'self' because the frontend talks only to the
    # same-origin /api/ that nginx proxies.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # Cache hashed Vite assets for 1 year
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Re-add security headers (add_header in a location block replaces parent)
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    }

    location / {
        try_files $uri $uri/ /index.html;

        # index.html names the hashed bundles, so a cached copy pins the browser to the
        # PREVIOUS deploy's assets until it happens to revalidate. Everything under
        # /assets/ is content-hashed and stays immutable; only this one entry point has
        # to be re-fetched, and it is 0.5 kB.
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    }
}
