<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio Analyzer</title>
    <meta
      name="description"
      content="Cost basis, market value, dividends and Swiss tax reporting for an Interactive Brokers portfolio."
    />
    <!-- Inline SVG data URI rather than a file: it is a few hundred bytes, so a second
         request to fetch it costs more than embedding it, and it cannot 404 after a
         deploy. The two themes are handled by the media query inside the SVG, since
         currentColor does not resolve in a favicon. -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cstyle%3Erect%7Bfill:%230f172a%7D%40media(prefers-color-scheme:dark)%7Brect%7Bfill:%23e2e8f0%7D%7D%3C/style%3E%3Crect width='32' height='32' rx='7'/%3E%3Cpath d='M6 22 L13 14 L18 19 L26 9' fill='none' stroke='%2338bdf8' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <!-- Tints the browser chrome on mobile, matching the app's own background in each
         theme rather than flashing the opposite one on load. -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#020817" media="(prefers-color-scheme: dark)" />
    <!-- It serves one account's financial data and is linked from nowhere. -->
    <meta name="robots" content="noindex, nofollow" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
